name: brew_helper
description: 啤酒酿造车间一线操作员辅助学习工具（离线，Flutter + Drift）
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: 2.20.0
  sqlite3_flutter_libs: 0.5.24
  path_provider: 2.1.3
  path: 1.9.0
  flutter_riverpod: 2.5.1
  crypto: 3.0.3
  flutter_markdown: 0.7.4
  file_selector: 1.0.3
  quick_actions: 1.0.6
  markdown: 7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  drift_dev: 2.20.0
  build_runner: 2.4.11
  flutter_launcher_icons: 0.13.1
  sqlite3: 2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/books/
    - assets/books/ferm_sop/
    - assets/books/ferm_fault/
    - assets/books/ferm_calc/
    - assets/books/ferm_safety/
    - assets/books/ferm_newbie/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#7C3E0A"
  adaptive_icon_foreground: assets/branding/app_icon.png
